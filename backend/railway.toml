# Railway: set Root Directory to `backend` (or deploy this folder).
# Add a Postgres plugin and link it so DATABASE_URL is injected.
# Full steps: docs/DEPLOY.md

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
