# Backend API + Postgres.
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f api
# Stop:   docker compose down
#
# Frontend still runs on your machine: cd frontend && npm run dev
# Put GROQ_API_KEY in backend/.env (loaded via env_file below)

services:
  db:
    image: postgres:16
    container_name: trekpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: TrekPal
    ports:
      - "5432:5432"
    volumes:
      - trekpal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TrekPal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: trekpal-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override localhost DATABASE_URL from .env — inside Docker the host is "db"
      DATABASE_URL: postgresql://postgres:root@db:5432/TrekPal
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: http://localhost:3000
    # Dev override: Dockerfile CMD is production (no --reload).
    command: >
      sh -c "alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Live code reload while developing
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  trekpal-postgres-data:
