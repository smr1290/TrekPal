# Backend API + Postgres.
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f api
# Stop:   docker compose down
#
# Frontend still runs on your machine: cd frontend && npm run dev

services:
  db:
    image: postgres:16
    container_name: trekpal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: TrekPal
    ports:
      - "5432:5432"
    volumes:
      - trekpal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TrekPal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: trekpal-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Inside Docker, host is the service name "db", not localhost
      DATABASE_URL: postgresql://postgres:root@db:5432/TrekPal
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "10080"
      CORS_ORIGINS: http://localhost:3000
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama3-70b-8192}
    volumes:
      # Live code reload while developing
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  trekpal-postgres-data:
